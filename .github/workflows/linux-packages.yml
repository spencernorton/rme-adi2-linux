name: Linux packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential debhelper dh-python \
            pybuild-plugin-pyproject python3-all python3-setuptools python3-pytest lintian
      - name: Build the package
        run: dpkg-buildpackage -us -uc -b
      - name: Lintian
        run: lintian --pedantic --fail-on warning ../rme-adi2-control_*.changes
      - name: Install and test the installed package
        run: |
          mkdir dist && mv ../rme-adi2-control_*_all.deb dist/
          sudo apt-get install -y -qq ./dist/rme-adi2-control_*_all.deb xvfb
          cp -r tests "$RUNNER_TEMP/t"
          cd "$RUNNER_TEMP"
          xvfb-run -a python3 -m pytest -q -p no:cacheprovider t -k "not packaging"
          python3 -c "import adi2.app as a; assert a.__file__.startswith('/usr/lib/python3/'); p = a.bundled_profiles_dir(); assert p and any(p.glob('*.json')), p"
          cmp /usr/share/icons/hicolor/512x512/apps/tech.norvi.Adi2Control.png \
            "$GITHUB_WORKSPACE/macOS/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png"
      - uses: actions/upload-artifact@v4
        with:
          name: rme-adi2-control-deb
          path: dist/*.deb
          if-no-files-found: error
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: adi2-control-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
