[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rme-adi2-control"
version = "1.1.0"
description = "Linux remote, EQ builder and PipeWire setup for the RME ADI-2 DAC/Pro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
adi2-control = "adi2.app:main"
adi2-eq = "adi2.eqbuild:main"

[tool.setuptools.packages.find]
where = ["src"]
